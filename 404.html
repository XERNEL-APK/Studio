<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
<script>
  (function () {
    try {
      var saved = localStorage.getItem("xernel-theme");
      var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) { /* localStorage unavailable — dark default from the html tag stays */ }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — XERNEL APK</title>
<meta name="description" content="This page doesn't exist on XERNEL APK.">
<meta name="theme-color" content="#080A08">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/logo-180.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="index.html" aria-label="XERNEL APK home">
      <img class="brand__logo" src="assets/logo.png" alt="" width="34" height="34">
      <span class="brand__name">XERNEL<span> APK</span></span>
    </a>
    <div class="header-search search-field" id="header-search-field">
      <svg class="search-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="search-field__input" id="header-search-input" type="search" placeholder="Search applications…" aria-label="Search applications">
      <button class="search-field__clear" id="header-search-clear" type="button" aria-label="Clear search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="header-actions">
      <button class="btn--icon theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to light theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div class="error-page">
      <div>
        <p class="error-page__code">404</p>
        <h1 class="error-page__title">Page not found</h1>
        <p class="error-page__desc">The page you're looking for doesn't exist or may have moved.</p>
        <a class="btn btn--primary btn--lg" href="index.html">Back to Store</a>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer__bottom">
    <span>ALL RIGHTS RESERVED 2026 © XERNEL</span>
  </div>
</footer>

<script src="js/theme.js" defer></script>
<script src="js/store.js" defer></script>
<script src="js/pwa.js" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (window.XernelStore) {
      window.XernelStore.initHeaderSearchNav("header-search-input", "header-search-clear", "header-search-field");
      window.XernelStore.initSearchShortcut();
    }
  });
</script>
</body>
</html>
